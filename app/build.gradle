import com.vanniktech.maven.publish.AndroidSingleVariantLibrary

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.vanniktech.maven.publish' version '0.34.0'
}

android {
    namespace 'io.customerly.androidsdk'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    testImplementation 'junit:junit:4.13.2'
    // Provides a real org.json implementation on the JVM so the manual
    // (de)serializers can be unit-tested without an emulator/Robolectric.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}

def libraryVersion = "1.2.0"

android.buildFeatures.buildConfig = true

mavenPublishing {
    publishToMavenCentral()

    signAllPublications()

    configure(new AndroidSingleVariantLibrary("release", true, false))

    coordinates("io.customerly", "customerlyandroidsdk", libraryVersion)

    pom {
        name = "Customerly Android SDK"
        description = "SDK for integrating Customerly in Android apps"
        url = "https://github.com/customerly/CustomerlyAndroidSDK"
        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }
        developers {
            developer {
                id = "customerly"
                name = "Customerly Dev Team"
                email = "developers@customerly.io"
            }
        }
        scm {
            connection = "scm:git:https://github.com/customerly/CustomerlyAndroidSDK.git"
            developerConnection = "scm:git:ssh://git@github.com/customerly/CustomerlyAndroidSDK.git"
            url = "https://github.com/customerly/CustomerlyAndroidSDK"
        }
    }
}
