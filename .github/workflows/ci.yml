name: CI

# Validate every PR (and pushes to the default branch) *before* code is merged.
# The Release workflow only runs on tags, so without this a broken build or a
# failing test is caught only at publish time.
on:
  pull_request:
  push:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs 'tools', which recent cmdline-tools no longer ship.
          packages: 'platform-tools'

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lint

      - name: Assemble SDK (release)
        run: ./gradlew :app:assembleRelease
